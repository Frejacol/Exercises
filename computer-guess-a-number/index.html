<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I will guess your number</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/guess.js" defer></script>
  </head>
  <body>
    <div class="game-container">
      <h1>I will guess your number</h1>
      <p class="description">Think of a number between 1 and 100</p>
      <p id="computerGuess" class="computerGuess"></p>
      <button class="start">Start</button>
      <div class="buttons">
        <button class="higher hidden">Higher</button>
        <button class="lower hidden">Lower</button>
        <button class="correct hidden">Correct</button>
      </div>
      <p class="amountOfGuesses"></p>
    </div>
  </body>
</html>
