<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the number</title>
    <script src="js/number.js" defer></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>Guess the number</h1>
      <p class="description">Pick a number between 1 and 100</p>
      <div class="input-container">
        <input type="number" class="guess-input" />
        <button class="guess">Guess</button>
      </div>
      <p class="helpText start-text">Try guessing a number</p>
    </div>
  </body>
</html>
